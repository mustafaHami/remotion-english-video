# Installation inspectée : nginx sur l'hôte, n8n lié à 127.0.0.1:5678.
map $http_upgrade $englizy_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name n8n.mhd-projects.cloud;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://n8n.mhd-projects.cloud$request_uri; }
}
server {
    listen 443 ssl;
    server_name n8n.mhd-projects.cloud;
    ssl_certificate /etc/letsencrypt/live/n8n.mhd-projects.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.mhd-projects.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    # Évite de journaliser les chemins des webhooks et les paramètres d'URL.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $englizy_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
