# À inclure dans le serveur HTTPS existant. Uniquement les objets MP4 préparés.
location ~ "^/englizy-media/(?<englizy_media_id>[a-f0-9]{64})[.]mp4$" {
    alias /var/lib/englizy-public-media/$englizy_media_id.mp4;
    default_type video/mp4;
    autoindex off;
    access_log off;
    log_not_found off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    limit_except GET HEAD { deny all; }
}
location /englizy-media/ { return 404; }
