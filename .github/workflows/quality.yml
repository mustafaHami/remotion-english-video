name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run browser
      - run: npm run check
      - run: npm test
      - run: npm run verify
      - run: python scripts/planning/import-calendar.py
      - run: npm run preview:all
